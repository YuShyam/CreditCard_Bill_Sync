name: 🏦 Daily Credit Card Bill Sync

on:
  schedule:
    # 每天台灣時間上午 09:00 (UTC 01:00) 自動執行排程
    - cron: '0 1 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動觸發執行 (點擊 "Run workflow")

concurrency:
  group: bill-sync-lock
  cancel-in-progress: false

jobs:
  sync:
    name: 🔄 掃描帳單並同步至 Google Sheets
    runs-on: windows-latest

    steps:
      - name: 📥 檢出程式庫代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝專案相依套件 (含 winocr OCR 引擎)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 執行帳單自動化處理中樞 (Bill Sync Master)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PDF_PASSWORDS: ${{ secrets.PDF_PASSWORDS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
        run: |
          python bill_sync_master.py
